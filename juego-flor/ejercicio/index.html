<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una flor para ti</title>
  <!-- link conecta este HTML con el archivo que contiene los estilos. -->
  <link rel="stylesheet" href="flor.css">
</head>
<body>
  <header class="dedicatoria"><h1>Para ti</h1><p>Que esta flor te recuerde lo especial que eres. 💛</p></header>
  <label class="control"><input type="checkbox" id="pausa"> Pausar animaciones</label>
  <div class="escena" role="img" aria-label="Flor amarilla que se abre, con corazones flotantes">
    <div class="hearts" aria-hidden="true"><span class="heart h1">♥</span><span class="heart h2">♥</span><span class="heart h3">♥</span><span class="heart h4">♥</span><span class="heart h5">♥</span><span class="heart h6">♥</span><span class="heart h7">♥</span><span class="heart h8">♥</span><span class="heart h9">♥</span><span class="heart h10">♥</span><span class="heart h11">♥</span><span class="heart h12">♥</span></div>
    <div class="stem"></div><div class="leaf"></div>
    <!-- corona agrupa los pétalos y el centro. Animaremos todo este grupo. -->
    <div class="corona"><i class="petalo p1"></i><i class="petalo p2"></i><i class="petalo p3"></i><i class="petalo p4"></i><i class="petalo p5"></i><i class="petalo p6"></i><i class="petalo p7"></i><i class="petalo p8"></i><div class="centro"></div></div>
  </div>
</body>
</html>
